server.port=8081

# .env 파일 로드 (가장 먼저 선언)
spring.config.import=optional:file:BackEnd/.env[.properties]

# Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
app.upload-dir=static/uploads
app.static-root=static

# AI service configuration
app.ai-listing.base-url=http://localhost:8002

# JWT Configuration
jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token-validity-ms=900000
jwt.refresh-token-validity-ms=604800000
jwt.refresh-token-cookie-domain=
jwt.refresh-token-cookie-secure=true
jwt.refresh-token-cookie-same-site=None
