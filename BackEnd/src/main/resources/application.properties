server.port=8081

# .env ?뚯씪 濡쒕뱶 (媛쒕컻 ?몄쓽)
spring.config.import=optional:file:.env[.properties],optional:file:./BackEnd/.env[.properties],optional:file:../.env[.properties]

# Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# N+1 Query Optimization
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
app.upload.base-dir=uploads
app.upload.product-dir=products
app.upload.profile-base-dir=uploads/userprofile
app.upload-dir=${app.upload.base-dir}
app.static-root=${app.upload.base-dir}

# AI service configuration
app.ai-listing.base-url=${AI_LISTING_BASE_URL:http://model:8000}

# JWT Configuration
jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token-validity-ms=900000
jwt.refresh-token-validity-ms=604800000
jwt.refresh-token-cookie-domain=
jwt.refresh-token-cookie-secure=true
jwt.refresh-token-cookie-same-site=None

# OAuth Redirect Base (frontend URL)
# ?꾨줈?뺤뀡 湲곕낯媛믪? ?쒕퉬???꾨찓?? 濡쒖뺄?먯꽌??OAUTH_REDIRECT_BASE濡?override
app.oauth.redirect-base=${OAUTH_REDIRECT_BASE:https://newtag.store}

# Kakao OAuth (Custom Implementation)
kakao.client-id=${KAKAO_CLIENT_ID:bf5d20743fdd4d4c160dcc583d445d02}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${app.oauth.redirect-base}/api/v1/auth/kakao/callback

# Google OAuth (Custom Implementation)
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${app.oauth.redirect-base}/api/v1/auth/google/callback

# Naver OAuth (Custom Implementation)
naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}
naver.redirect-uri=${app.oauth.redirect-base}/api/v1/auth/naver/callback

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://localhost,https://localhost}
logging.level.org.springframework.security=TRACE
logging.level.com.goldenRun.NewTag=DEBUG

# S3 (NCP Object Storage) Configuration
aws.s3.bucket-name=${S3_BUCKET_NAME}
aws.s3.endpoint=${S3_ENDPOINT}
aws.region=${AWS_REGION}
aws.credentials.access-key=${AWS_ACCESS_KEY}
aws.credentials.secret-key=${AWS_SECRET_KEY}

# Tell Spring to use X-Forwarded-
# headers from the proxy
server.forward-headers-strategy=NATIVE





